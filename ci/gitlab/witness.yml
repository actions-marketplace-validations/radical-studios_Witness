# Witness for GitLab merge requests. Include it from .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/radical-studios/witness/main/ci/gitlab/witness.yml
#
# To comment on merge requests, add a masked CI/CD variable
# WITNESS_GITLAB_TOKEN holding a project access token with the `api` scope.
# Without it, the job still publishes a Code Quality report.
witness:
  stage: test
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
    WITNESS_VERSION: latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache git curl
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - sh -c "$(curl -fsSL https://raw.githubusercontent.com/radical-studios/witness/main/install.sh)" -- --version "$WITNESS_VERSION" --to /usr/local/bin
  script:
    - witness report --format gitlab-codequality > gl-code-quality-report.json
    - |
      if [ -n "${WITNESS_GITLAB_TOKEN:-}" ]; then
        witness post --platform gitlab
      else
        witness report --format markdown
      fi
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
