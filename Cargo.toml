[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/radical-studios/witness"
rust-version = "1.88"
# Distributed as prebuilt binaries, not through crates.io.
publish = false

[workspace.dependencies]
witness-core = { path = "crates/witness-core" }
witness-git = { path = "crates/witness-git" }
witness-platform = { path = "crates/witness-platform" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "0.8"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
